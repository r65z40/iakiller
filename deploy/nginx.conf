# Alternative à Caddy. Certificat : sudo certbot --nginx -d cartes.exemple.fr
# sudo cp deploy/nginx.conf /etc/nginx/sites-available/carto && sudo ln -s ../sites-available/carto /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name cartes.exemple.fr;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP réelle uniquement : ne jamais propager un X-Forwarded-For fourni par le client
        # (sinon les limites de débit applicatives seraient contournables).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
